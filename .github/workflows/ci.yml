name: CI

on:
  push:
    branches: [main, "devops/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_MONGO_URI: mongodb://localhost:27017/stm-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Run tests
        run: |
          set +e
          npm run test:ci 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=DEBUG test failure::$(grep -E '●|Error|Expected|Received|threshold|Cannot' /tmp/test.log | head -12 | cut -c1-220 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$code"
      - run: npm audit --omit=dev --audit-level=critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage

  frontend:
    name: Frontend lint + typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build

  image-and-e2e:
    name: Docker image, scan and Selenium e2e
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t student-task-manager:ci .
      - name: Scan image (fail on fixable critical CVEs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: student-task-manager:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: End-to-end tests
        env:
          JWT_SECRET: ci-only-secret
          IMAGE_NAME: student-task-manager
          IMAGE_TAG: ci
        run: |
          mkdir -p test-results
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up \
            --abort-on-container-exit --exit-code-from e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: test-results

  validate-config:
    name: Validate compose, Kubernetes and monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          JWT_SECRET=x GRAFANA_ADMIN_PASSWORD=x docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config -q
          docker compose -f docker-compose.ci.yml config -q
      - name: Kubernetes manifests render
        run: kubectl kustomize k8s > /dev/null
      - name: Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v2.55.1 check rules /m/alerts.yml
