# Local Jenkins:  docker compose -f jenkins/docker-compose.jenkins.yml up -d --build   ->  http://localhost:8081
# NOTE: mounting the Docker socket gives Jenkins control of the host's Docker. Use only on a machine you own.
name: jenkins
services:
  jenkins:
    build: .
    user: root
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins-home:
