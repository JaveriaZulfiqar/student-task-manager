apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: student-task-manager
resources:
  - namespace.yaml
  - mongo.yaml
  - app.yaml
# Secrets are NOT stored in git. Create it first (see README):
#   kubectl -n student-task-manager create secret generic app-secrets --from-literal=JWT_SECRET=$(openssl rand -hex 32)
images:
  - name: student-task-manager
    newName: student-task-manager
    newTag: latest
