groups:
  - name: student-task-manager
    rules:
      - alert: AppDown
        expr: up{job="student-task-manager"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Student Task Manager is not responding to scrapes" }
      - alert: HighErrorRate
        expr: sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m])) / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "More than 5% of requests are failing with 5xx" }
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 latency is above 1 second" }
